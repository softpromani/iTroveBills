
name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Setup PHP & Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Build frontend (Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      # Setup SSH using Hostinger RSA key
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_deploy_rsa
          chmod 600 ~/.ssh/hostinger_deploy_rsa

          # Remove Windows line endings if present
          sed -i 's/\r$//' ~/.ssh/hostinger_deploy_rsa

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # Verify SSH authentication before deployment
      - name: Test Hostinger SSH
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/hostinger_deploy_rsa \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "whoami && pwd"
      - name: Prepare remote build directory
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/hostinger_deploy_rsa \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.PROJECT_PATH }}/public/build' && ls -ld '${{ secrets.PROJECT_PATH }}/public/build'"
      # Upload only Vite build folder
      - name: Upload built assets (Vite)
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/hostinger_deploy_rsa -o IdentitiesOnly=yes -o BatchMode=yes" \
            public/build/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_PATH }}/public/build/"

      # Deploy via SSH
      - name: Deploy via SSH
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/hostinger_deploy_rsa \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PROJECT_PATH }}"

            echo "🛠 Putting app in maintenance mode..."
            php artisan down || true

            echo "🔄 Pulling latest changes..."
            git pull origin master

            echo "📦 Checking if composer install is needed..."
            CHANGED=false

            if [ ! -d "vendor" ]; then
                CHANGED=true
            elif [ composer.lock -nt vendor ]; then
                CHANGED=true
            fi

            if [ "$CHANGED" = true ]; then
                echo "📦 Installing composer dependencies..."
                composer2 install --no-interaction --prefer-dist --optimize-autoloader
            else
                echo "✅ Skipping composer install - no changes."
            fi

            echo "🗄 Checking if migrations are pending..."
            OUTDATED=$(php artisan migrate:status | grep 'No' | wc -l)

            if [ "$OUTDATED" -gt 0 ]; then
                echo "🗄 Running pending migrations..."
                php artisan migrate --force --verbose
            else
                echo "✅ No migrations needed."
            fi

            echo "🧹 Clearing caches..."
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            echo "🚀 Optimizing application..."

            echo "🔓 Bringing app back online..."
            php artisan up

            echo "✅ Deployment completed!"

          EOF
